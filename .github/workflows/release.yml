name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build installable plugin archive
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            printf 'GLPI BrandPulse %s\n' "${GITHUB_REF_NAME}" > dist/release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/glpi-brandpulse-${VERSION}.zip"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
              --title "GLPI BrandPulse ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
