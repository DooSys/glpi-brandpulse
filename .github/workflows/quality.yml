name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -path ./dist -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check public/js/brandpulse.js

      - name: Validate plugin XML
        run: php -r '$xml = simplexml_load_file("brandpulse.xml"); exit($xml === false ? 1 : 0);'
